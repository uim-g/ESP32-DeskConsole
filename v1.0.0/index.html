<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskConsole v1.0.0</title>
<link rel="stylesheet" href="style.css">
<main>
<header><h1>DeskConsole</h1><span>v1.0.0</span></header>
<div class="console">
 <div class="keys"><button data-key="0" aria-label="左上 GPIO 4">Q</button><button data-key="1" aria-label="左下 GPIO 5">A</button></div>
 <canvas width="320" height="240" aria-label="DeskConsole 虚拟 TFT 屏幕"></canvas>
 <div class="keys"><button data-key="2" aria-label="右上 GPIO 6">↑</button><button data-key="3" aria-label="右下 GPIO 7">↓</button></div>
</div>
<p>点击两侧按键，或使用 Q、A、↑、↓。F1 使用 ↓ 起跑。</p>
<p>时钟采用电脑时间（马来西亚时区）。<span id="weather">天气连接中</span>。Wi-Fi 与设备读数为模拟值。</p>
</main>
<script src="fonts.js"></script>
<script src="app.js"></script>
</html>
